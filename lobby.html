<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171222"><title>PA Party｜聲瑪大廳</title><link rel="stylesheet" href="src/style.css?v=10.20-WEB.1"><link rel="stylesheet" href="src/theme.css?v=10.28-UI.1"><link rel="stylesheet" href="src/lobby.css?v=10.20-WEB.1"><link rel="stylesheet" href="src/theme-v2.css?v=10.28-UI.1"><link rel="stylesheet" href="src/share-dialog.css"><link rel="stylesheet" href="src/lobby-header.css?v=1023-menu-2"><link rel="stylesheet" href="src/site-footer.css?v=10.20-WEB.1"></head>
<body class="lobby-page"><header><div class="header-inner"><a class="brand" href="lobby.html" aria-label="PA • PARTY"><span class="brand-logo" role="img" aria-label="PA • PARTY"></span></a><nav class="lobby-header-actions" aria-label="大廳操作"><a href="index.html">回官網</a><a id="lobby-player-login" href="lobby.html?portalLogin=player">玩家登入</a><a id="lobby-admin-login" href="lobby.html?portalLogin=admin">管理登入</a></nav><details class="lobby-tools"><summary aria-label="更多工具" aria-expanded="false"><span class="lobby-tools-icon" aria-hidden="true"><span></span><span></span><span></span></span></summary><div class="lobby-tools-panel"><button type="button" id="lobby-share">分享</button></div></details></div></header><main>
<section class="lobby-intro"><h1>聲瑪大廳</h1><p class="muted">選一位聲瑪主播，或找一首想聽的歌。</p><p id="lobby-entry-status" class="lobby-entry-status" role="status" aria-live="polite"></p></section>
<section class="card" data-lobby-room-section><h2>找主播</h2><form class="toolbar" data-lobby-search="rooms"><input id="lobby-room-q" type="search" maxlength="100" aria-label="搜尋主播" placeholder="輸入主播名稱"><button type="submit">搜尋</button></form><div id="rooms-results" aria-live="polite"></div></section>
<section class="card lobby-songbook"><h2>聲瑪廳內找歌</h2><form class="toolbar" data-lobby-search="songs"><input id="lobby-q" type="search" maxlength="100" aria-label="搜尋歌名或歌手" placeholder="歌名、歌手都可以"><button type="submit">搜尋</button></form>
<div class="lobby-filters"><label>語言<select id="lobby-language"><option value="">全部語言</option></select></label><label>演唱者類型<select id="lobby-performer"><option value="">全部類型</option></select></label><label>版本<select id="lobby-version"></select></label></div>
<div class="list-sort-rail"><span class="list-sort compact-sort" role="group" aria-label="歌曲排序"><button type="button" data-lobby-sort="newest" aria-pressed="true">最新</button><span aria-hidden="true">｜</span><button type="button" data-lobby-sort="oldest" aria-pressed="false">最舊</button></span></div><div id="songs-results" aria-live="polite"></div></section>
<noscript><p>請啟用 JavaScript 以搜尋主播與歌曲。</p></noscript></main><dialog id="dialog" aria-modal="true"></dialog><footer id="site-footer" class="site-footer" aria-label="網站資訊"></footer><script type="module" src="src/lobby-menu.js?v=1023-menu-1"></script><script type="module" src="src/lobby-entry.js?v=10.28-UI.1&pwa=1"></script><script type="module" src="src/site-footer.js?v=10.20-WEB.1"></script></body></html>
