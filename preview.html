const TABLES=['players','songs','ledger','queue','crowns','cards','wishes'];
const TIERS=[{name:'金卡',fee:55599,price:4200,months:1},{name:'鉑金卡',fee:125000,price:9999,months:1},{name:'鑽石卡',fee:375000,price:18188,months:1},{name:'黑卡',fee:500000,price:27999,months:3},{name:'至尊卡',fee:925000,price:55599,months:0}];
const DEFAULTS={status:'空閒中',hourlyLimit:2,opening:'19:00～01:00（可能加班）',audition:387,livePrice:2990,liveDouble:500,crownDouble:18188,tiers:TIERS,plans:[{name:'一般 2 首',amount:2,fee:5555,double:990},{name:'一般 3 首',amount:3,fee:7299,double:1399},{name:'一般 6 首',amount:6,fee:13999,double:2799},{name:'🏅 金牌歌單',amount:10,fee:22887,double:4200}],tags:['嗨歌','傷感','甜歌','怪歌','慢歌'],manual:'1. 先登入玩家，再挑首喜歡的歌 ♡\n2. 提歌扣存歌，每小時有上限。\n3. 現點送出後，等怕怕確認禮物。\n4. 冠歌主人照一般規則；其他玩家依卡別現點。'};
const uid=()=>crypto.randomUUID();
const list=x=>[...new Set((Array.isArray(x)?x:String(x||'').split(/[,，、；;]/)).map(x=>String(x).trim()).filter(Boolean))];
const norm=x=>String(x??'').trim().toLocaleLowerCase();
function empty(){return {schemaVersion:2,revision:0,settings:structuredClone(DEFAULTS),...Object.fromEntries(TABLES.map(k=>[k,[]]))};}
function stamp(t=Date.now()){return new Date(t).toISOString();}
function timeValue(x){if(typeof x==='number')return x;if(!x)return NaN; if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}[ T]\d/.test(x)&&!/(Z|[+-]\d\d:\d\d)$/.test(x)){const m=x.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4]-8,+m[5],+(m[6]||0));}return Date.parse(x);}
const hourKey=t=>Math.floor(timeValue(t)/3600000);
const liveDay=t=>new Date(timeValue(t)+8*3600000-19*3600000).toISOString().slice(0,10);
function addMonths(t,n){const d=new Date(timeValue(t)+8*3600000),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const end=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,end));return stamp(d.getTime()-8*3600000);}
const balance=(s,id)=>s.ledger.filter(x=>x.playerId===id).reduce((n,x)=>n+Number(x.amount),0);
const playerSearch=(s,q)=>s.players.filter(p=>[p.name,p.playerId,...p.ids,...p.names].some(v=>norm(v).includes(norm(q))));
const isActive=(c,t)=>!!c.activatedAt&&timeValue(c.activatedAt)<=timeValue(t)&&(!c.expiresAt||timeValue(c.expiresAt)>timeValue(t));
const crownFor=(s,id,t)=>s.crowns.find(c=>c.songId===id&&isActive(c,t));
const usedHour=(s,t)=>s.queue.filter(q=>q.kind==='saved'&&!q.test&&q.acceptedAt&&hourKey(q.acceptedAt)===hourKey(t)).length;

function recommendSongs(s,id){const history=s.queue.filter(q=>q.playerId===id&&q.status==='completed'&&!q.selfProvided&&!q.test),artists=new Set(),tags=new Set();for(const q of history){const item=s.songs.find(x=>x.songId===q.songId);if(item){item.artist.split(/[／/,，]/).forEach(x=>artists.add(x.trim()));item.tags.forEach(x=>tags.add(x));}}const seed=id||'guest',hash=str=>{let n=2166136261;for(const char of str)n=Math.imul(n^char.charCodeAt(0),16777619);return n>>>0;};return [...s.songs].sort((a,b)=>{const score=x=>x.artist.split(/[／/,，]/).filter(y=>artists.has(y.trim())).length*3+x.tags.filter(y=>tags.has(y)).length*2;return score(b)-score(a)||hash(seed+liveDay(clock())+a.songId)-hash(seed+liveDay(clock())+b.songId);}).slice(0,5);}

function filteredSongs(){return state.songs.filter(s=>matchesSong(s,filters.q,filters.tags));}
function songToolbar(adminMode=false){return `<div class="toolbar"><input id="song-q" aria-label="搜尋歌曲" placeholder="歌名、歌手、語言、歌詞、標籤都能搜…" value="${h(filters.q)}">${button('清除','clearFilters')}${adminMode?button('新增歌曲','editSong')+button('批量匯入','import','songs'):''}</div><div class="chips search-tags" role="group" aria-label="標籤多選">${state.settings.tags.map(t=>`<label><input type="checkbox" data-filter-tag="${h(t)}" ${filters.tags.includes(t)?'checked':''}>${h(t)}</label>`).join('')}<small>可多選，符合任一標籤即可</small></div>`;}
function renderBook(){const p=paginate(filteredSongs(),'book',20);$('#app').innerHTML=card('🎵 歌本',songToolbar()+`<div id="song-list">${songRows(p.rows)}${p.nav}</div>`,true);}
function renderGallery(){const rows=state.cards.filter(c=>galleryFilter==='history'||galleryFilter==='current'&&currentCards().includes(c)||galleryFilter==='expired'&&c.expiresAt&&timeValue(c.expiresAt)<=Date.now()+offset);$('#app').innerHTML=card('🖼️ 卡片牆',`<div class="tabs">${[['current','目前卡片'],['history','歷史卡片'],['expired','已過期']].map(([id,label])=>button(label,'galleryFilter',id,galleryFilter===id?'active':'')).join('')}</div><div class="gallery">${rows.map(photoHtml).join('')||blank()}</div>`,true);}
function playerTabs(id,manager=false){const p=state.players.find(x=>x.playerId===id);if(!p)return blank('找不到玩家');const qs=state.queue.filter(q=>q.playerId===id),done=qs.filter(q=>q.status==='completed'&&!q.test&&!q.selfProvided),cs=state.crowns.filter(c=>c.playerId===id),cards=state.cards.filter(c=>c.playerId===id),wishes=state.wishes.filter(w=>w.playerId===id),names=[['overview',manager?'基本資料':'總覽'],['ledger','存歌'],['queue','點歌'],['crowns','冠歌'],['cards','卡片'],['wishes','許願']];let body='';if(subtab==='overview'){const counts=done.reduce((a,q)=>(a[q.songId]=(a[q.songId]||0)+1,a),{});body=`<div class="stats"><div class="stat">💾 存歌<b>${balance(state,id)}</b></div><div class="stat">🎤 已唱<b>${qs.filter(q=>q.status==='completed'&&!q.test).length}</b></div><div class="stat">👑 冠歌<b>${cs.length}</b></div><div class="stat">🖼️ 卡片<b>${cards.length}</b></div></div><div class="notice">${h(p.certification?'🐯 怕怕認證：'+p.certification:say('center'))}</div><div class="chips achievement-badges">${(manager?achievements(state,id,clock()):state.badges||[]).slice(0,3).map(x=>`<span class="tag">${h(x)}</span>`).join('')}</div><h3 style="margin-top:20px">我最常聽的歌</h3>${Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,n])=>`<div class="song"><div class="info">${h(song(id)?.title||'舊歌曲')}</div><b>×${n}</b></div>`).join('')||blank()}<div class="notice">ID：${h(p.ids.join('、')||'尚未填寫')}<br>曾用名：${h(p.names.join('、'))}</div>${manager?button('編輯玩家／密碼','editPlayer',id):button('我的名稱與密碼','self')}`;}if(subtab==='ledger')body=ledgerRows(id,manager);if(subtab==='queue')body=queueRows(qs,manager);if(subtab==='crowns')body=crownsHtml(cs,manager);if(subtab==='cards')body=`<div class="gallery">${cards.map(photoHtml).join('')||blank()}</div>`;if(subtab==='wishes')body=wishRows(wishes,manager);return `<h2>${h(p.name)}</h2><div class="tabs">${names.map(([k,n])=>button(n,'subtab',k,subtab===k?'active':'')).join('')}</div>${body}`;}
function renderCenter(){const p=me();$('#app').innerHTML=card('👤 玩家中心',p?playerTabs(p.playerId):blank('請先登入'),true);}
function ledgerRows(id,manager){let rows=state.ledger.filter(l=>!id||l.playerId===id);if(!id&&ledgerQuery){const ids=playerSearch(state,ledgerQuery).map(x=>x.playerId);rows=rows.filter(l=>ids.includes(l.playerId));}rows.sort((a,b)=>(timeValue(b.at)||0)-(timeValue(a.at)||0));const p=paginate(rows,'ledger');return `${manager?`<div class="toolbar">${!id?`<input id="ledger-query" value="${h(ledgerQuery)}" placeholder="搜尋玩家名稱、ID、曾用名" aria-label="存歌玩家搜尋">`:''}${button('新增存歌','addLedger',id||'')}</div><small>最近 · 每頁 10 筆</small>`:''}<div id="ledger-results">${p.rows.map(l=>`<div class="song admin-row"><div class="info"><b>${manager?h(playerName(l.playerId))+' · ':''}<span class="${l.amount>=0?'positive':'negative'}">${l.amount>=0?'+':''}${l.amount} 首</span></b><small>${time(l.at)} · ${h(l.note)}</small></div>${manager?`<div class="actions">${button('編輯','editLedger',l.id)}${button('刪除','deleteLedger',l.id,'tiny danger')}</div>`:''}</div>`).join('')||blank()}${p.nav}</div>`;}
function queueRows(rows,manager){const p=paginate(rows,'queue');return p.rows.map(q=>`<div class="song admin-row"><div class="info"><b>${h(song(q.songId)?.title||q.title)}</b><small>${manager?h(playerName(q.playerId))+' · ':''}${q.kind==='saved'?'提歌':'現點'} · ${time(q.at)}</small><div><span class="tag">${statusName[q.status]}${manager&&q.selfProvided?' · 自帶（不計熱門／常聽）':''}</span>${q.test?'<span class="tag">測試</span>':''}${q.status==='waiting'?`<span class="tag">${h(q.stage)}</span>`:''}</div></div>${manager?`<div class="actions">${q.status==='pending'?button('✅ 已收到禮物','queueOp',q.id,'tiny','data-op="approve"'):''}${q.status==='waiting'?button('🎤 完成演唱','queueOp',q.id,'tiny','data-op="complete"')+button('準備時間／狀態','stage',q.id)+button('↑','move',q.id,'tiny','data-step="-1"')+button('↓','move',q.id,'tiny','data-step="1"')+(q.kind==='live'?button('未唱→存歌','queueOp',q.id,'tiny','data-op="store"'):''):''}${['waiting','pending'].includes(q.status)?button('取消','queueOp',q.id,'tiny','data-op="cancel"'):''}${button('永久刪除','queueOp',q.id,'tiny danger','data-op="delete"')}</div>`:''}</div>`).join('')+p.nav;}
function wishRows(rows,manager){const p=paginate(rows,'wishes');return p.rows.map(w=>`<div class="song"><div class="info"><b>${h(w.title)}－${h(w.artist)}</b><small>${manager?h(playerName(w.playerId))+' · ':''}${time(w.at)} · ${h(w.note)}</small><div class="tag">${h(w.status)}</div>${w.status==='已學會'?'<p class="positive">✨ 願望成真！這首怕怕學會啦～</p>':''}${w.url?`<a href="${h(w.url)}" target="_blank" rel="noopener">歌曲連結 ↗</a>`:''}</div>${manager?button('處理','editWish',w.id):''}</div>`).join('')+p.nav;}
const adminTabs=[['dashboard','📊 總覽'],['queue','🎤 待播'],['songs','🎵 歌曲'],['players','👤 玩家'],['ledger','💾 存歌'],['crowns','👑 冠歌'],['cards','🖼️ 卡片'],['wishes','🌟 許願池'],['stats','📈 統計'],['settings','⚙️ 設定']];
function renderAdmin(){let body='';if(tab==='dashboard'){body=statsHtml(stats(state,clock()))+`<div class="stats" style="margin-top:12px">${[['歌曲',state.songs.length],['待播',state.queue.filter(q=>q.status==='waiting').length],['玩家',state.players.length],['冠歌',state.crowns.length],['待確認現點',state.queue.filter(q=>q.status==='pending').length]].map(([k,n])=>`<div class="stat">${k}<b>${n}</b></div>`).join('')}</div><h3 style="margin-top:20px">${dayLabel(clock())} · 快捷狀態</h3><div class="actions">${['🟢 空閒中','🔴 忙碌中','🟠 準備中','🟣 暫停點歌'].map(v=>button(v,'status',v.slice(3),'')).join('')}</div><h3 style="margin-top:20px">目前待播</h3>${queueRows(state.queue.filter(q=>q.status==='waiting'),true)}${!state.songs.length?button('讀取舊版資料並核對','migrate','','primary'):''}${state.migrationIssues?.length?`<details class="notice warning"><summary>資料移轉待核對 ${state.migrationIssues.length} 項</summary>${state.migrationIssues.map(h).join('<br>')}</details>`:''}`;}
 if(tab==='queue')body=button('後台代播／自帶','onBehalf')+`<p class="muted">確認禮物後才成立；完成演唱才增加熱門次數。</p>${queueRows(state.queue,true)}`;
 if(tab==='songs')body=songToolbar(true)+`<details class="tag-management"><summary>管理全站標籤</summary><div class="chips">${state.settings.tags.map(t=>button(h(t)+' ×','deleteTag',t)).join('')}${button('＋標籤','addTag')}</div></details><div id="song-batch-bar">${songBatchBar()}</div><div id="song-list">${adminSongResults()}${paginate(filteredSongs(),'songs',20).nav}</div>`;
 if(tab==='players'){if(selectedPlayer)body=button('← 玩家列表','backPlayers')+playerTabs(selectedPlayer,true);else body=`<div class="toolbar"><input id="player-query" placeholder="名稱、ID、曾用名都可以" aria-label="搜尋玩家" value="${h(adminQuery)}">${button('新增玩家','editPlayer')}${button('批量匯入','import','players')}</div><div id="player-results">${playerResults()}</div>`;}
 if(tab==='ledger')body=ledgerRows(null,true);
 if(tab==='crowns')body=`<div class="toolbar">${button('新增冠歌','editCrown')}${button('批量匯入','import','crowns')}${button('如何冠歌？','crownHelp')}</div>${crownsHtml(state.crowns,true)}`;
 if(tab==='cards')body=`<div class="toolbar">${button('上傳照片卡','editCard')}</div><div class="gallery">${state.cards.map(c=>`<div>${photoHtml(c)}${button('編輯','editCard',c.id)}${button('刪除','deleteCard',c.id,'tiny danger')}</div>`).join('')||blank()}</div>`;
 if(tab==='wishes')body=wishRows(state.wishes,true);
 if(tab==='stats')body=`<label>選擇直播場次<input id="stats-day" type="date" value="${liveDay(clock())}"></label><div id="stats-result">${statsHtml(stats(state,clock()))}</div><p class="muted">19:00 切場；收到按成立時間，唱了按完成時間，存了只算新增量，不算取消退款。</p>`;
 if(tab==='settings')body=settingsHtml();
 $('#app').innerHTML=`<div class="admin-banner"><b>🔐 怕怕的管理後台</b><div class="actions">${button('回首頁','home')}${button('登出管理','adminLogout')}</div></div><div class="tabs">${adminTabs.map(([id,label])=>button(label,'adminTab',id,tab===id?'active':'')).join('')}</div><section class="card">${body}</section>`;
}
function settingsHtml(){return `<div class="notice ${draft?'warning':''}">${draft?'📝 草稿模式：只存在這台裝置':'☁️ 正式同步模式'}</div><div class="actions">${button('開始草稿測試','draft')}${button('匯出備份','backup')}${draft?button('正式同步','publish','','primary')+button('離開草稿','leaveDraft'):''}</div><hr><h3>直播與價格</h3><p class="muted">${h(state.settings.opening)} · 試音 ${money(state.settings.audition)} · 一般現點 ${money(state.settings.livePrice)}＋雙費 ${money(state.settings.liveDouble)}</p>${button('編輯設定與說明書','editSettings')}${button('存歌方案','editPlans')}${button('冠歌卡別價格','editTiers')}<hr><h3>資料清理</h3><p class="muted">可分別清除測試紀錄；全部歸零仍保留歌曲、玩家、冠歌。</p>${button('清理資料','cleanup','','danger')}`;}
function render(){header();if(route==='admin'&&admin)renderAdmin();else if(route==='book')renderBook();else if(route==='center'&&session)renderCenter();else if(route==='gallery')renderGallery();else renderHome();}

async function loginDialog(){modal('👤 玩家登入','<label>名稱、ID 或曾用名<input id="login-query" placeholder="找找自己"></label><div id="login-results"></div>');}
async function chooseLogin(id){const result=demo?full.players.find(p=>p.playerId===id):(await api({op:'search',query:id})).players.find(p=>p.playerId===id);if(!result)return;modal('登入 '+result.name,`${select('loginId','本次使用的 ID',result.ids.length?result.ids.map(x=>[x,x]):[['','沒有平台 ID']],result.ids[0])}${result.hasPassword||result.password?field('password','玩家密碼','','password','autocomplete="current-password"'):''}`,async f=>{let token='demo';if(!demo)token=(await api({op:'login',playerId:id,loginId:f.get('loginId'),password:f.get('password')||''})).token;else if(String(result.password||'')!==String(f.get('password')||''))throw new Error('玩家密碼不正確');session={playerId:id,loginId:f.get('loginId')||'',token};put('player',session);await go('home');});}
async function adminLogin(){modal('🔐 管理入口',`<p>這裡只有怕怕大美女才可以進去</p>${demo?'<div class="notice warning">這是本機測試後台，沒有正式玩家資料。</div>':field('email','管理員 Email','','email','required autocomplete="username"')+field('password','密碼','','password','required autocomplete="current-password"')}`,async f=>{const auth=demo?{token:'demo',expiresIn:43200}:await api({op:'adminLogin',email:f.get('email'),password:f.get('password')});admin={...auth,until:Date.now()+43200000,accessUntil:Date.now()+(auth.expiresIn-60)*1000};put('admin',admin);await go('admin');});}
async function requestSong(id,kind,selfProvided=false){if(!session)return loginDialog();if(state.settings.status==='暫停點歌')return toast(say('paused'));const s=song(id);if(!s)return toast('歌曲已更新，請重新選歌');const c=crownFor(state,id,clock()),other=c&&c.playerId!==session.playerId;if(other)kind='live';const used=state.hourBucket===hourKey(clock())?state.hourlyUsed||0:0;if(kind==='saved'&&used>=state.settings.hourlyLimit)return toast(say('full'));if(kind==='saved'&&balance(state,session.playerId)<1)return toast(say('noCredit'));const price=other?c.price:state.settings.livePrice;modal(kind==='saved'?(selfProvided?'🎲 接受命運':'🎤 提這首歌'):'🎁 確認現點',`<h3>${h(s.title)}－${h(s.artist)}</h3>${other?`<div class="notice">👑 這首是 ${h(playerName(c.playerId))} 的 ${h(c.tier)} 冠歌<br>冠歌主人以外的玩家只能依卡別現點。</div>`:''}${kind==='live'?`<p>給歌手 ${money(price)} 探鑽${other?'':'＋雙費 '+money(state.settings.liveDouble)}</p>${check('gift','我已確認禮物價格，送出後等待管理員確認')}`:'<p>扣 1 首共用存歌，加入待播。</p>'}`,async f=>{await dispatch('request',{songId:id,kind,selfProvided,giftConfirmed:f.has('gift')});toast(say('success'));});$('#modal-form button[type=submit]').textContent=kind==='live'?'確定現點':'確定提歌';}
function crownHelp(){modal('👑 如何冠歌？',`<div class="table-wrap"><table><thead><tr><th>卡別</th><th>辦卡給歌手</th><th>雙費</th><th>其他玩家現點</th><th>期限</th></tr></thead><tbody>${state.settings.tiers.map(t=>`<tr><td>${h(t.name)}</td><td>${money(t.fee)}</td><td>${money(state.settings.crownDouble)} × 2</td><td>${money(t.price)}／首</td><td>${t.months?t.months+' 個月':'永久'}</td></tr>`).join('')}</tbody></table></div><div class="notice">🎤 給歌手：辦理這張冠歌卡的費用。<br>💰 雙費：聲瑪樂團 ${money(state.settings.crownDouble)}＋2號位主持 ${money(state.settings.crownDouble)}，兩筆都需要。<br>👥 其他玩家：冠歌主人以外的人。<br>選歌曲 → 選卡別 → 付辦卡費＋雙費 → 確認後生效 ✨</div><p class="muted">金額皆為探鑽。冠歌主人照一般規則；其他玩家在有效期間內只能依卡別現點。</p>`);}
function prices(){modal('直播與存歌價格',`<p>${h(state.settings.opening)}<br>試音 ${money(state.settings.audition)} 探鑽<br>一般一首：歌手 ${money(state.settings.livePrice)}＋雙費 ${money(state.settings.liveDouble)}</p><div class="table-wrap"><table><tr><th>方案</th><th>給歌手</th><th>雙費</th><th>首數</th></tr>${state.settings.plans.map(p=>`<tr><td>${h(p.name)}</td><td>${money(p.fee)}</td><td>${money(p.double)}</td><td>${p.amount}</td></tr>`).join('')}</table></div><p class="muted">雙費給聲瑪樂團＋2號位主持。金牌歌單：9,999＋12,888＝22,887。</p>`);}
function wish(){if(!session)return loginDialog();modal('🌟 許個願',field('title','歌名','','text','required')+field('artist','歌手','','text','required')+area('note','備註')+field('url','歌曲連結（選填）','','url'),async f=>{await dispatch('wish',formData(f));toast('收到你的許願啦～ 願望想快點實現可考慮一首學歌費一個金牌😍');});}
function editPlayer(id){const p=state.players.find(p=>p.playerId===id)||{};modal(p.playerId?'編輯玩家':'新增玩家',`<div class="form-grid">${field('name','主要名稱',p.name||'','text','required')}${field('ids','平台 ID、其他 ID（逗號分開）',(p.ids||[]).join(','))}${field('names','曾用名／相關名',(p.names||[]).join(','))}${field('certification','🐯 怕怕認證',p.certification||'')}${field('password','玩家密碼（留空即清除）',p.password||'')}${!p.playerId?field('balance','初始存歌',0,'number','min="0"'):''}${area('note','備註',p.note||'')}${check('test','測試玩家（不列正式統計）',p.test)}</div>`,async f=>dispatch('player',{...formData(f),playerId:p.playerId,test:f.has('test')}));}
function playerOptions(){return [['','請選玩家'],...state.players.map(p=>[p.playerId,p.name+' · '+(p.ids.join('、')||'無平台 ID')])];}

async function compress(file,max=1400){if(!file||!file.type.startsWith('image/'))throw new Error('請選圖片');const bitmap=await createImageBitmap(file),canvas=document.createElement('canvas'),ratio=Math.min(1,max/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*ratio);canvas.height=Math.round(bitmap.height*ratio);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/webp',.82).split(',')[1];}
function editCard(id){const c=state.cards.find(c=>c.id===id)||{};modal('🖼️ 照片卡片',`${field('file','上傳照片（自動壓縮、縮圖）','','file','accept="image/*"')}${select('playerId','綁定玩家（選填）',[['','不綁定'],...playerOptions().slice(1)],c.playerId)}${area('description','簡述',c.description||'')}${field('startsAt','開始時間',dateInput(c.startsAt||clock()),'datetime-local','required')}${field('expiresAt','到期時間（留空永久）',dateInput(c.expiresAt),'datetime-local')}`,async f=>{let url=c.url,thumbnail=c.thumbnail;const file=f.get('file');if(file?.size){if(demo)throw new Error('圖片上傳需連接 Supabase，預覽不存 Base64 圖片');url=(await api({op:'upload',image:await compress(file),mime:'image/webp'})).url;thumbnail=(await api({op:'upload',image:await compress(file,480),mime:'image/webp'})).url;}await dispatch('card',{id:c.id,url,thumbnail,playerId:f.get('playerId'),description:f.get('description'),startsAt:isoInput(f.get('startsAt')),expiresAt:isoInput(f.get('expiresAt'))});});}

function select(name,label,values,value){if(!['playerId','songId'].includes(name))return nativeSelect(name,label,values,value);const match=values.find(v=>String(v[0])===String(value)),optional=label.includes('選填');return `<div class="entity-picker" data-entity-kind="${name}"><label>${h(label)}<input type="search" data-entity-query autocomplete="off" placeholder="${name==='playerId'?'搜尋玩家名稱、ID、曾用名':'搜尋歌名、歌手、語言、標籤'}" value="${h(match?.[0]?match[1]:'')}" aria-label="${h(label)}搜尋" ${optional?'':'required'}></label><input type="hidden" name="${name}" value="${h(value||'')}"><div class="entity-results"></div></div>`;}

document.addEventListener('submit',e=>{for(const box of e.target.querySelectorAll('.entity-picker')){const input=box.querySelector('[data-entity-query]');if((input.required||input.value.trim())&&!box.querySelector('[type=hidden]').value){e.preventDefault();e.stopImmediatePropagation();$('#dialog-error').textContent='請從搜尋結果點選正確的玩家或歌曲';input.focus();return;}}},true);
function seedPreviewCrowns(s){if(s.previewCrownsRestored)return;s.previewCrownsRestored=true;for(const [id,title,artist] of [['legacy-crown-1','三心愛意','不不玩家'],['legacy-crown-2','crazy 1 night','葵葵']]){if(!s.crowns.some(c=>c.id===id||c.title===title))s.crowns.push({id,title,artist,ownerName:'不不玩家',playerId:null,songId:null,tier:'至尊卡',fee:925000,price:55599,double:18188,months:0,activatedAt:null,expiresAt:null,legacyDisplay:true,note:'原網站冠歌：永久；生效時間未知。請核對綁定與款項，不自動設定生效時間。'});}}

function playerResults(){const p=paginate(playerSearch(state,adminQuery),'players');return `${p.rows.map(p=>`<div class="song"><div class="info"><b>${h(p.name)}${p.test?' 🧪':''}</b><small>${h(p.ids.join('、'))} · 💾 ${balance(state,p.playerId)}｜👑 ${state.crowns.filter(c=>c.playerId===p.playerId).length}｜🖼️ ${state.cards.filter(c=>c.playerId===p.playerId).length}｜🎤 ${state.queue.filter(q=>q.playerId===p.playerId&&q.status==='completed'&&!q.test).length}</small></div>${button('查看','playerDetail',p.playerId)}</div>`).join('')}${p.nav}`;}

function adminSongResults(){const p=paginate(filteredSongs(),'songs',20);return p.rows.map(s=>`<div class="song selectable-song ${selectedSongs.has(s.songId)?'is-selected':''}"><label class="song-check"><input type="checkbox" data-song-select="${h(s.songId)}" aria-label="選取 ${h(s.title)}" ${selectedSongs.has(s.songId)?'checked':''}></label><div class="info"><b>${h(s.title)}${s.new?' <span class="tag">✨ 新練</span>':''}</b><small>${h(s.artist)} · ${h(s.cat)} · ${plays(s)} 次</small><div class="song-tags">${s.tags?.length?s.tags.map(t=>`<span class="tag">${h(t)}</span>`).join(''):'<small class="subtle">尚未貼標籤</small>'}</div>${s.murmur?`<div class="subtle">💬 ${h(s.murmur)}</div>`:''}</div><div class="actions">${button('💬 碎碎念','editMurmur',s.songId)}${button('編輯','editSong',s.songId)}${button('刪除','deleteSong',s.songId,'tiny danger')}</div></div>`).join('')||blank('沒有符合的歌曲');}
function songBatchBar(){for(const id of selectedSongs)if(!song(id))selectedSongs.delete(id);const matches=filteredSongs(),visible=paginate(matches,'songs',20).rows,all=visible.length&&visible.every(s=>selectedSongs.has(s.songId));return `<div class="batch-toolbar"><label class="check-row"><input type="checkbox" data-select-song-page ${all?'checked':''} ${visible.length?'':'disabled'}>本頁全選</label><strong role="status" aria-live="polite">已選 ${selectedSongs.size} 首</strong>${button('選取搜尋結果（'+matches.length+'）','selectFilteredSongs','', 'tiny', matches.length?'':'disabled')}${button('取消選取','clearSongSelection','','tiny',selectedSongs.size?'':'disabled')}${button('批次編輯／貼標籤','bulkEditSongs','','tiny primary',selectedSongs.size?'':'disabled')}${songUndo&&songUndo.until>Date.now()?button('復原剛才的批次修改','undoSongBatch'):''}</div><small>可跨頁選取；搜尋不會清除已選歌曲。</small>`;}
function renderSongResults(){if(!$('#song-list'))return;const p=paginate(filteredSongs(),isAdmin()?'songs':'book',20);$('#song-list').innerHTML=(isAdmin()?adminSongResults():songRows(p.rows))+p.nav;if($('#song-batch-bar')){$('#song-batch-bar').innerHTML=songBatchBar();const rows=p.rows,checked=rows.filter(s=>selectedSongs.has(s.songId)).length,all=$('[data-select-song-page]');if(all)all.indeterminate=checked>0&&checked<rows.length;}}
document.addEventListener('change',e=>{if(e.target.matches('[data-song-select]')){const id=e.target.dataset.songSelect;e.target.checked?selectedSongs.add(id):selectedSongs.delete(id);renderSongResults();}if(e.target.matches('[data-select-song-page]')){for(const s of paginate(filteredSongs(),'songs',20).rows)e.target.checked?selectedSongs.add(s.songId):selectedSongs.delete(s.songId);renderSongResults();}});
const songEditFields=s=>({cat:s.cat,artistType:s.artistType,tags:s.tags||[],new:!!s.new,murmur:s.murmur||''});
function bulkEditSongs(){const ids=[...selectedSongs].filter(id=>song(id));if(!ids.length)return toast('先勾選要修改的歌曲');modal('批次編輯 '+ids.length+' 首歌曲',`<details class="notice"><summary>查看這次選取的 ${ids.length} 首</summary><div class="batch-selection">${ids.map(id=>h(song(id).title)+'－'+h(song(id).artist)).join('<br>')}</div></details><p class="muted">只改你指定的欄位，其餘資料保留。</p><div class="form-grid">${nativeSelect('tagMode','標籤處理',[['keep','不變'],['add','加上勾選標籤'],['remove','移除勾選標籤'],['replace','改成以下標籤'],['clear','清空標籤']],'keep')}${nativeSelect('cat','語言',[['','不變'],'華語','韓語','台語','其他'],'')}<div class="full chips batch-tag-options">${state.settings.tags.map(t=>check('tags',t).replace('name="tags"',`name="tags" value="${h(t)}"`)).join('')}</div>${field('customTags','其他標籤（逗號分開）')}${nativeSelect('artistType','歌手分類',[['','不變'],'女歌手','男歌手','團體','合唱','其他'],'')}${nativeSelect('new','新練歌曲',[['','不變'],['true','設為新練'],['false','取消新練']],'')}${nativeSelect('murmurMode','碎碎念',[['keep','不變'],['set','統一填寫'],['clear','清空']],'keep')}${field('murmur','統一的碎碎念','','text','maxlength="40"')}</div><div id="batch-preview" class="notice" aria-live="polite">尚未指定修改項目</div>`,async f=>{const data=bulkSongData(f,ids),before=ids.map(id=>({songId:id,...songEditFields(song(id))}));await dispatch('songsBulk',data);songUndo={before,after:ids.map(id=>({songId:id,...songEditFields(song(id))})),until:Date.now()+10000};clearTimeout(songUndoTimer);songUndoTimer=setTimeout(()=>{songUndo=null;if($('#song-batch-bar'))$('#song-batch-bar').innerHTML=songBatchBar();},10000);renderSongResults();toast('已更新 '+ids.length+' 首歌曲，可在 10 秒內復原');});const form=$('#modal-form');form.addEventListener('change',()=>updateBulkPreview(form,ids));form.addEventListener('input',e=>{if(!e.isComposing)updateBulkPreview(form,ids);});}
function bulkSongData(f,ids){const data={songIds:ids,tagMode:f.get('tagMode'),tags:[...f.getAll('tags'),...list(f.get('customTags'))]};for(const k of ['cat','artistType'])if(f.get(k))data[k]=f.get(k);if(f.get('new'))data.new=f.get('new')==='true';if(f.get('murmurMode')!=='keep')data.murmur=f.get('murmurMode')==='clear'?'':f.get('murmur');return data;}
function updateBulkPreview(form,ids){const f=new FormData(form);if((f.getAll('tags').length||f.get('customTags').trim())&&f.get('tagMode')==='keep'){form.elements.tagMode.value='add';f.set('tagMode','add');}const d=bulkSongData(f,ids),parts=[];if(d.tagMode!=='keep')parts.push(({add:'加上標籤：',remove:'移除標籤：',replace:'改成標籤：',clear:'清空標籤'})[d.tagMode]+(d.tagMode==='clear'?'':d.tags.join('、')));if(d.cat)parts.push('語言：'+d.cat);if(d.artistType)parts.push('歌手分類：'+d.artistType);if('new'in d)parts.push(d.new?'設為新練歌曲':'取消新練');if('murmur'in d)parts.push(d.murmur?'碎碎念：'+d.murmur:'清空碎碎念');$('#batch-preview').textContent=parts.length?'將修改 '+ids.length+' 首：'+parts.join('；'):'尚未指定修改項目';}
async function undoSongBatch(){if(!songUndo||songUndo.until<Date.now())return toast('復原時間已過');const undo=songUndo;await dispatch('restoreSongEdits',{before:undo.before,after:undo.after});songUndo=null;clearTimeout(songUndoTimer);renderSongResults();toast('已復原剛才的批次修改');}
</script></body></html>
