<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171222"><meta name="apple-mobile-web-app-capable" content="yes"><title>PA Party｜APP 首頁</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="src/style.css?v=10.20-WEB.1"><link rel="stylesheet" href="src/theme.css?v=10.29-THEME.2"><style>body{min-height:100dvh}main.app-launcher{max-width:760px;margin:auto;padding-top:32px}.app-launcher h1{font-size:24px}.app-launcher .app-logo{display:block;width:112px;height:94px;margin:0 auto 22px;background:url(assets/pa-party-approved.png) 93% 44% / 255% auto no-repeat;mix-blend-mode:screen}.app-home-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.app-home-option{text-align:left;white-space:normal;padding:18px;min-height:92px}.app-home-option strong,.app-home-option small{display:block;overflow-wrap:anywhere}.app-home-option small{margin-top:8px}.app-launcher .toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.app-launcher .toolbar input{grid-column:1/-1;width:100%}.app-launcher .toolbar select{max-width:none;width:100%}.app-launcher [hidden]{display:none!important}.app-launcher .pagination{padding-top:10px}.app-launcher [role=status]{min-height:26px;overflow-wrap:anywhere}@media(max-width:420px){.app-home-list{grid-template-columns:1fr}.app-launcher .pagination{gap:5px}.app-launcher .pagination button{padding:6px}}</style></head>
<body><main class="app-launcher" data-app-launcher><span class="app-logo" role="img" aria-label="PA Party"></span><section class="card"><h1>預設開啟首頁</h1><p class="muted" data-app-current>選擇你的廳或主播，下次開啟 APP 直接進入。</p><p role="status" aria-live="polite" data-app-status>正在準備 APP…</p><form class="toolbar" data-app-search hidden><input type="search" maxlength="100" aria-label="搜尋廳或主播" placeholder="搜尋廳或主播名稱"><select aria-label="首頁類型"><option value="all">全部</option><option value="hall">大廳</option><option value="streamer">主播</option></select><button type="submit">搜尋</button></form><div class="app-home-list" data-app-results></div><div class="pagination" data-app-pager></div><div class="actions"><button type="button" data-app-retry hidden>重新連線</button><button type="button" data-app-choose hidden>選擇其他首頁</button></div><noscript><p>請啟用 JavaScript 以選擇 APP 預設首頁。</p></noscript></section></main>
<script type="module">import {API,PUBLISHABLE_KEY} from './src/config.js';import {mountPwaLauncher} from './src/pwa-launcher.js?v=10.20-PWA.1';const api=async body=>{const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:PUBLISHABLE_KEY},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const value=await response.json();if(!response.ok||value?.error)throw Error(value?.error||'連線暫時無法使用，請重試。');return value;};let storage;try{storage=localStorage;}catch{}mountPwaLauncher({document,window,api,storage});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});</script></body></html>
